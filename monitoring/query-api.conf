# Authentication is enforced by the HTTPS Ingress. Never publish this Service
# directly. Only these query routes are forwarded; ingestion/admin routes fail.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    proxy_read_timeout 120s;
    proxy_connect_timeout 5s;
    proxy_http_version 1.1;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' '';
    }
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    # Keep credentials inside the authentication boundary.
    proxy_set_header Authorization "";
    resolver kube-dns.kube-system.svc.cluster.local valid=30s;

    server {
        listen 8080;
        location = /healthz { return 200 "ok\n"; }
        location / { return 404; }
    }
    # A failed remote service login is a datasource error, not a browser login.
    # Preserve Grafana's session authentication and the original HTTP status.
    server {
        listen 3000;
        set $grafana http://grafana.monitoring.svc.cluster.local:3000;
        location ~ ^/api/(datasources/|ds/query$) {
            proxy_set_header Host $http_host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_hide_header WWW-Authenticate;
            proxy_pass $grafana;
        }
        location / { return 404; }
    }
    server {
        listen 9090;
        set $upstream http://prometheus.monitoring.svc.cluster.local:9090;
        location ~ ^/api/v1/(query|query_range|query_exemplars|series|labels|label/[^/]+/values|metadata|status/buildinfo)$ {
            limit_except GET POST { deny all; }
            proxy_pass $upstream;
        }
        location / { return 403; }
    }
    server {
        listen 3100;
        set $upstream http://loki.monitoring.svc.cluster.local:3100;
        location ~ ^/loki/api/v1/(query|query_range|format_query|status/buildinfo|tail|series|labels|label/[^/]+/values|index/stats|index/volume|index/volume_range|patterns|detected_fields|detected_field/[^/]+/values|detected_labels)$ {
            limit_except GET { deny all; }
            proxy_pass $upstream;
        }
        location / { return 403; }
    }
    server {
        listen 3200;
        set $upstream http://tempo.monitoring.svc.cluster.local:3200;
        location ~ ^/api/(echo|status/buildinfo|search|search/tags|search/tag/[^/]+/values|traces/[a-fA-F0-9]+|v2/traces/[a-fA-F0-9]+|v2/search|v2/search/tags|v2/search/tag/[^/]+/values|metrics/query|metrics/query_range|v2/metrics/query|v2/metrics/query_range)$ {
            limit_except GET { deny all; }
            proxy_pass $upstream;
        }
        location / { return 403; }
    }
}
