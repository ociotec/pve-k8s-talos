apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-remediation-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/name: node-remediation-controller
    app.kubernetes.io/instance: node-remediation-controller
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: node-remediation
    app.kubernetes.io/managed-by: infrastructure
    pve-k8s-talos/section: k8s-net
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-remediation-controller
  labels:
    app.kubernetes.io/name: node-remediation-controller
    app.kubernetes.io/instance: node-remediation-controller
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: node-remediation
    app.kubernetes.io/managed-by: infrastructure
    pve-k8s-talos/section: k8s-net
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list"]
  - apiGroups: ["csiaddons.openshift.io"]
    resources: ["networkfences"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-remediation-controller
  labels:
    app.kubernetes.io/name: node-remediation-controller
    app.kubernetes.io/instance: node-remediation-controller
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: node-remediation
    app.kubernetes.io/managed-by: infrastructure
    pve-k8s-talos/section: k8s-net
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: node-remediation-controller
subjects:
  - kind: ServiceAccount
    name: node-remediation-controller
    namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-remediation-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/name: node-remediation-controller
    app.kubernetes.io/instance: node-remediation-controller
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: node-remediation
    app.kubernetes.io/managed-by: infrastructure
    pve-k8s-talos/section: k8s-net
spec:
  replicas: ${replicas}
  selector:
    matchLabels:
      app.kubernetes.io/name: node-remediation-controller
      app.kubernetes.io/instance: node-remediation-controller
  template:
    metadata:
      annotations:
        remediation.pve-k8s-talos/config-checksum: ${config_checksum}
      labels:
        app.kubernetes.io/name: node-remediation-controller
        app.kubernetes.io/instance: node-remediation-controller
        app.kubernetes.io/component: controller
        app.kubernetes.io/part-of: node-remediation
        app.kubernetes.io/managed-by: infrastructure
        pve-k8s-talos/section: k8s-net
    spec:
      serviceAccountName: node-remediation-controller
      priorityClassName: infra-high
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: node-remediation-controller
                    app.kubernetes.io/instance: node-remediation-controller
      containers:
        - name: controller
          image: ${image}
          imagePullPolicy: IfNotPresent
          command: ["python3", "/opt/node-remediation/controller.py"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: REMEDIATION_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: node-remediation-controller
                  key: config.json
            - name: PROXMOX_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: node-remediation-proxmox
                  key: endpoint
            - name: PROXMOX_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: node-remediation-proxmox
                  key: api-token
            - name: PROXMOX_INSECURE
              valueFrom:
                secretKeyRef:
                  name: node-remediation-proxmox
                  key: insecure
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
              scheme: HTTP
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: ${cpu_request}
              memory: ${memory}
            limits:
              cpu: ${cpu_limit}
              memory: ${memory}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - name: controller
              mountPath: /opt/node-remediation
              readOnly: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      volumes:
        - name: controller
          configMap:
            name: node-remediation-controller
            defaultMode: 365
